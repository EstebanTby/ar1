<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Visualizador AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    #botonAR {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 25px;
      font-size: 16px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<model-viewer
  src="https://raw.githubusercontent.com/EstebanTby/ar1/main/1/modelo.glb"
  camera-controls
  ar
  ar-modes="quick-look"
  ar-scale="fixed"
  ios-src="https://raw.githubusercontent.com/EstebanTby/ar1/main/1/modelo.usdz"
  alt="Modelo 3D">
</model-viewer>

<a id="botonAR"
   rel="ar"
   href="https://raw.githubusercontent.com/EstebanTby/ar1/main/1/modelo.usdz"
   style="text-decoration:none;color:white">
  POSICIONAR EN MI ESPACIO
</a>

</body>
</html>
