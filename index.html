
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Demo AR</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      background: #eeeeee;
    }

    model-viewer {
      width: 100vw;
      height: 100vh;
    }

    .ar-button {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 15px 25px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<model-viewer
  src="https://raw.githubusercontent.com/EstebanTby/ar1/main/1/modelo.glb"
  ios-src="https://raw.githubusercontent.com/EstebanTby/ar1/main/1/modelo.usdz"

  ar
  ar-modes="quick-look"
  ar-scale="fixed"

  camera-controls
  alt="Mi modelo AR">

  <button slot="ar-button" class="ar-button">
    Posicionar modelo en mi espacio
  </button>

</model-viewer>

</body>
</html>
